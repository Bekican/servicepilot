services:
  postgres:
    image: postgres:17-alpine
    container_name: servicepilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - servicepilot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: servicepilot-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: servicepilot-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-servicepilot-local-demo-signing-key-change-me}
      Smtp__Host: mailpit
      Smtp__Port: 1025
      Smtp__EnableSsl: "false"
      Smtp__FromAddress: no-reply@servicepilot.local
      Smtp__FromName: ServicePilot
      Invitations__PublicBaseUrl: >-
        http://localhost:3000/invitations/accept
      Database__MigrateOnStartup: "true"
    ports:
      - "5267:8080"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: servicepilot-worker
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Database: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Smtp__Host: mailpit
      Smtp__Port: 1025
      Smtp__EnableSsl: "false"
      Smtp__FromAddress: no-reply@servicepilot.local
      Smtp__FromName: ServicePilot
      Invitations__PublicBaseUrl: >-
        http://localhost:3000/invitations/accept

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: servicepilot-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      SERVICEPILOT_API_URL: http://api:8080
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  servicepilot-postgres-data:
