name: ${COMPOSE_PROJECT_NAME}

x-runtime-defaults: &runtime-defaults
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  postgres:
    <<: *runtime-defaults
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    mem_limit: 1g
    cpus: 1.5
    networks:
      - backend

  mailpit:
    <<: *runtime-defaults
    image: ${MAILPIT_IMAGE}
    profiles: ["mailpit"]
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    mem_limit: 256m
    cpus: 0.5
    networks:
      - backend

  migrator:
    image: ${SERVICEPILOT_MIGRATOR_IMAGE}
    profiles: ["operations"]
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT_NAME}
      ConnectionStrings__Database: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Observability__OtlpEnabled: "false"
    restart: "no"
    mem_limit: 512m
    cpus: 1.0
    networks:
      - backend

  api:
    <<: *runtime-defaults
    image: ${SERVICEPILOT_API_IMAGE}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${DOTNET_ENVIRONMENT_NAME}
      AllowedHosts: api;${PUBLIC_DOMAIN}
      ConnectionStrings__Database: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS}
      Smtp__FromName: ${SMTP_FROM_NAME}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Invitations__PublicBaseUrl: https://${PUBLIC_DOMAIN}/invitations/accept
      PasswordReset__PublicBaseUrl: https://${PUBLIC_DOMAIN}/
      ForwardedHeaders__KnownNetworks__0: 172.16.0.0/12
      Database__MigrateOnStartup: "false"
      Observability__OtlpEnabled: "false"
      KnowledgeStorage__RootPath: /var/lib/servicepilot/knowledge
    volumes:
      - knowledge-data:/var/lib/servicepilot/knowledge
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 768m
    cpus: 1.0
    networks:
      - backend

  worker:
    <<: *runtime-defaults
    image: ${SERVICEPILOT_WORKER_IMAGE}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT_NAME}
      ConnectionStrings__Database: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS}
      Smtp__FromName: ${SMTP_FROM_NAME}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Invitations__PublicBaseUrl: https://${PUBLIC_DOMAIN}/invitations/accept
      Observability__OtlpEnabled: "false"
      KnowledgeStorage__RootPath: /var/lib/servicepilot/knowledge
      KnowledgeAi__OllamaBaseUrl: ${OLLAMA_BASE_URL}
      KnowledgeAi__EmbeddingModel: qwen3-embedding:0.6b
    volumes:
      - knowledge-data:/var/lib/servicepilot/knowledge
    healthcheck:
      test: ["CMD-SHELL", "grep -aq 'ServicePilot.Worker.dll' /proc/1/cmdline"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 512m
    cpus: 0.75
    networks:
      - backend

  web:
    <<: *runtime-defaults
    image: ${SERVICEPILOT_WEB_IMAGE}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=64m,mode=0755,uid=1001,gid=1001
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SERVICEPILOT_API_URL: http://api:8080
      SERVICEPILOT_OTLP_ENABLED: "false"
      SERVICEPILOT_ENVIRONMENT: ${DEPLOYMENT_TIER}
      SERVICEPILOT_VERSION: ${RELEASE_ID}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 768m
    cpus: 1.0
    networks:
      - edge
      - backend

  caddy:
    <<: *runtime-defaults
    image: ${CADDY_IMAGE}
    depends_on:
      web:
        condition: service_healthy
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/staging/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 256m
    cpus: 0.5
    networks:
      - edge
      - backend

volumes:
  postgres-data:
  knowledge-data:
  caddy-data:
  caddy-config:

networks:
  edge:
  operations:
  backend:
    internal: true
