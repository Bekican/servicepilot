name: servicepilot-staging

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - backend
      - operations

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    networks:
      - backend

  migrator:
    image: ${SERVICEPILOT_MIGRATOR_IMAGE}
    profiles: ["operations"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Staging
      ConnectionStrings__Database: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    restart: "no"
    networks:
      - backend

  api:
    image: ${SERVICEPILOT_API_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__Database: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Smtp__Host: mailpit
      Smtp__Port: 1025
      Smtp__EnableSsl: "false"
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS}
      Smtp__FromName: ${SMTP_FROM_NAME}
      Invitations__PublicBaseUrl: https://${STAGING_DOMAIN}/invitations/accept
      Database__MigrateOnStartup: "false"
    networks:
      - backend

  worker:
    image: ${SERVICEPILOT_WORKER_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DOTNET_ENVIRONMENT: Staging
      ConnectionStrings__Database: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Smtp__Host: mailpit
      Smtp__Port: 1025
      Smtp__EnableSsl: "false"
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS}
      Smtp__FromName: ${SMTP_FROM_NAME}
      Invitations__PublicBaseUrl: https://${STAGING_DOMAIN}/invitations/accept
    networks:
      - backend

  web:
    image: ${SERVICEPILOT_WEB_IMAGE}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      SERVICEPILOT_API_URL: http://api:8080
      HOSTNAME: 0.0.0.0
      PORT: 3000
    networks:
      - edge
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/staging/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
      - backend

  backup:
    image: ${SERVICEPILOT_BACKUP_IMAGE}
    profiles: ["operations"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DEPLOYMENT_ENVIRONMENT: staging
      RELEASE_ID: ${RELEASE_ID:-unknown}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-auto}
      RESTIC_AUTO_INIT: ${RESTIC_AUTO_INIT:-false}
      RESTIC_KEEP_DAILY: ${RESTIC_KEEP_DAILY:-14}
      RESTIC_KEEP_WEEKLY: ${RESTIC_KEEP_WEEKLY:-8}
      RESTIC_APPLY_RETENTION: ${RESTIC_APPLY_RETENTION:-true}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
    restart: "no"
    networks:
      - operations

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  edge:
  operations:
  backend:
    internal: true
