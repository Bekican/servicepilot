name: Feature request
description: Propose a focused product or engineering improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which user or engineering problem should be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable success without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Trust and architecture boundaries
      description: Note tenant, authorization, privacy, RAG, data or operational impact.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What simpler approaches or trade-offs were considered?
