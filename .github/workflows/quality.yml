name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify MVP
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Validate production-shaped staging operations
        run: |
          sh -n deploy/staging/operations/backup.sh
          sh -n deploy/staging/operations/restore-drill.sh
          sh -n scripts/validate-staging-environment.sh
          sh -n scripts/staging-compose.sh
          sh -n scripts/test-staging-validation.sh
          sh -n scripts/deploy-staging.sh
          sh -n scripts/backup-staging.sh
          sh -n scripts/restore-drill-staging.sh
          sh -n scripts/initialize-restic-staging.sh
          sh -n scripts/rollback-staging.sh
          docker compose --env-file deploy/staging/.env.example --env-file deploy/staging/release.env.example -f compose.staging.yaml config --quiet
          docker compose --env-file deploy/staging/.env.example --env-file deploy/staging/release.env.example -f compose.staging.yaml -f compose.staging.observability.yaml config --quiet
          docker compose --env-file deploy/staging/.env.example --env-file deploy/staging/release.env.example -f compose.staging.yaml -f compose.staging.backup.yaml --profile operations config --quiet
          docker compose --env-file deploy/staging/.env.local.example --env-file deploy/staging/.env.minio.local.example -f compose.staging.local.yaml -f compose.staging.minio.yaml config --quiet
          sh scripts/test-staging-validation.sh
          docker build --file Dockerfile.backup --tag servicepilot-backup:quality .

      - name: Run the complete quality gate
        shell: pwsh
        run: ./scripts/verify-mvp.ps1

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
