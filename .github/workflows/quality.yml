name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify MVP
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Validate production-shaped staging operations
        run: |
          sh -n deploy/staging/operations/backup.sh
          sh -n deploy/staging/operations/restore-drill.sh
          sh -n scripts/validate-staging-environment.sh
          sh -n scripts/deploy-staging.sh
          sh -n scripts/backup-staging.sh
          sh -n scripts/restore-drill-staging.sh
          sh -n scripts/initialize-restic-staging.sh
          sh -n scripts/rollback-staging.sh
          docker compose --env-file deploy/staging/.env.example -f compose.staging.yaml config --quiet
          docker compose --env-file deploy/staging/.env.local.example --env-file deploy/staging/.env.minio.local.example -f compose.staging.local.yaml -f compose.staging.minio.yaml config --quiet
          docker build --file Dockerfile.backup --tag servicepilot-backup:quality .

      - name: Run the complete quality gate
        shell: pwsh
        run: ./scripts/verify-mvp.ps1

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
