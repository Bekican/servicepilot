services:
  postgres:
    networks:
      - backend
      - operations

  backup:
    image: ${SERVICEPILOT_BACKUP_IMAGE}
    profiles: ["operations"]
    init: true
    stop_grace_period: 10m
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_TIER}
      RELEASE_ID: ${RELEASE_ID}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-auto}
      RESTIC_AUTO_INIT: ${RESTIC_AUTO_INIT:-false}
      RESTIC_KEEP_DAILY: ${RESTIC_KEEP_DAILY:-14}
      RESTIC_KEEP_WEEKLY: ${RESTIC_KEEP_WEEKLY:-8}
      RESTIC_APPLY_RETENTION: ${RESTIC_APPLY_RETENTION:-true}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
      KNOWLEDGE_SOURCE_PATH: /source/knowledge
    volumes:
      - knowledge-data:/source/knowledge:ro
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    mem_limit: 1g
    cpus: 1.0
    networks:
      - operations
